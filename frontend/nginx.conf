server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ── CACHING: the hashed files forever, the ones that POINT at them never ──
    #
    # There were no Cache-Control headers here at all, and the symptom was a
    # deploy that appeared not to take: new images pushed, containers recreated,
    # and the browser still running the old app.
    #
    # Without Cache-Control a browser applies HEURISTIC caching -- roughly a
    # tenth of the age since Last-Modified -- so it decides for itself how long
    # to keep a file. Vite content-hashes the bundles (index-Du1WJics.js), so
    # those are safe to keep forever and a new build has a new name. But
    # `index.html` is NOT hashed: it is the file that names the hashed bundle.
    # A stale copy of it asks for the PREVIOUS bundle filename, which the new
    # image does not contain -- so the deploy serves either the old app or a
    # blank page, and the server looks correct from every angle while it does.
    #
    # Bumping the image tag cannot fix that. The server had the new files; the
    # browser never asked for them.

    # Hashed assets: immutable, because the name changes when the content does.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The guides are markdown fetched at runtime and their names never change,
    # so they go stale the same way index.html does -- a corrected chapter would
    # not appear. Revalidated, not uncached: an ETag makes that a cheap 304.
    location ~ ^/(user-guide|client-guide)/ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # SPA fallback — serve index.html for all non-file routes.
    #
    # `no-cache` does NOT mean "do not cache": it means revalidate before use,
    # which with nginx's ETag is a 304 carrying no body. One conditional request
    # per page load, in exchange for a deploy that is actually deployed.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to the backend service
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # LLM-powered endpoints (discovery upload, billing parse) can take 2+ minutes
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 30s;

        # THE LIMIT IS ENFORCED HERE AND NOWHERE ELSE, and it must match
        # `settings.max_upload_mb`, which is what the browser is told so it can
        # refuse a file before spending minutes uploading it.
        # tests/test_upload_limit.py fails if the two disagree.
        #
        # 50m was refusing ordinary input: scanned productions from one opposing
        # firm run 36 MB to 665 MB, so the SMALLEST of them nearly hit it. 128m
        # is bounded by memory rather than preference -- the upload routes read
        # the whole body into RAM and no container sets a memory limit.
        #
        # nginx rejects an oversized body mid-flight with its own HTML page, so
        # the client treats a 413 as the same actionable message it would have
        # shown up front.
        client_max_body_size 128m;
    }
}
